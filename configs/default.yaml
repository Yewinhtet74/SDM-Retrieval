# MRL Multimodal Retrieval — Single Source of Truth for Configuration (edit here, do not modify the code)
paths:
  # ↓↓↓ When switching machines, only change these two lines
  # Data is downloaded here by scripts/00_fetch_data.py and 09_fetch_coco.py
  data_root:   D:/datasets/flickr30k
  coco_root:   D:/datasets/coco       # Cross-domain distractors + cross-domain benchmark
                                      # (see RESULTS.md §5 for measurement notes)
  output_root: ./outputs

# model:
#   name: ViT-B-16
#   pretrained: laion2b_s34b_b88k
#   device: cuda
#   precision: fp16              # Feature extraction precision

model:
  name: RN50
  pretrained: openai
  device: cuda
  precision: fp16

data:
  batch_size_extract: 256
  num_workers: 4
  holdout_train: 6000          # Hold out from Flickr30k train; not used for training,
                               # used as clean same-domain distractors
  use_holdout: false           # Default false: main results use all 29,000 training images;
                               # For clean same-domain experiments, train separately with
                               # --set data.use_holdout=true

mrl:
  dims: [512, 384, 256, 128,64]  # Nested dimensions = evaluation dimensions
  # dims: [1024, 768, 512, 384, 256, 128,64]  # Nested dimensions = evaluation dimensions
  # dims: [768, 512, 384, 256, 128,64]  # Nested dimensions = evaluation dimensions

  full_dim: 512

adapter:
  hidden: 1024                  # Internal hidden width; output is always 512 (= embedding dimension)
  shared: true                  # Share the same adapter between image and text

loss:
  # Ablation findings (see RESULTS.md §4):
  # τ must be learnable (fixed 0.07 performs worst overall; learnable converges to ≈0.055);
  # per_dim is unnecessary (the 5 τ_m values converge to almost the same value);
  # c=inverse performs best for low dimensions.
  temperature: { mode: learnable, init: 0.07 }   # fixed | learnable | per_dim
  weight:      { mode: inverse }                 # equal | inverse | linear
  nested: true                                   # true = MRL; false = non-nested ablation

train:
  epochs: 20
  batch_size: 1024              # Can be increased significantly when using cached features
  lr: 1.0e-3
  weight_decay: 0.01
  seed: 42

lora:                            # Phase 2: unfreeze the backbone (scripts/06_train_lora.py)
  r: 8
  alpha: 16
  dropout: 0.0
  targets: [in_proj, out_proj, mlp]   # in_proj = fused q/k/v | out_proj | mlp
  towers: [visual, text]
  epochs: 5
  batch_size: 256              # In practice, 384 reaches 6.66GB VRAM on 8GB;
                               # 256 leaves some headroom
  lr: 1.0e-4                   # Backbone LoRA LR, much lower than the adapter's 1e-3
  adapter_lr: 1.0e-4
  weight_decay: 0.01
  grad_checkpointing: true
  init_adapter: adapter_mrl    # Warm-start from the Phase 1 adapter; null = train from scratch
  distill: 0.0                 # Cosine distillation weight against the frozen original CLIP embeddings
                               # (prevents catastrophic forgetting); 0 = disabled
                               # Target is taken directly from cached original features in outputs/features,
                               # with almost zero additional cost

eval:
  directions: [i2t, t2i]
  gallery: full_31k            # Large gallery for latency/storage evaluation
  faiss_index: flat            # flat | ivf
  precisions: [fp32, fp16, int8]

experiment:
  name: adapter_mrl             # Result/checkpoint naming, useful for distinguishing the four groups